# Wazuh Agent Configuration Snippets
# Project: Wazuh SOC Monitoring Lab
#
# IMPORTANT:
# These are sanitized configuration examples for a lab environment.
# Do not replace your complete ossec.conf with this file.
# Copy only the relevant blocks into the appropriate locations in your existing configuration.
# Do not commit passwords, keys, or private credentials to GitHub.

############################################################
# 1. FILE INTEGRITY MONITORING
############################################################

# Add this line INSIDE the existing <syscheck> ... </syscheck> section.

<directories realtime="yes">C:\Wazuh-Test</directories>

############################################################
# 2. WINDOWS DEFENDER EVENT CHANNEL
############################################################

# Add this block as a separate block INSIDE <ossec_config>,
# but NOT inside the <syscheck> section.

<localfile>
  <location>Microsoft-Windows-Windows Defender/Operational</location>
  <log_format>eventchannel</log_format>
</localfile>

############################################################
# EXAMPLE STRUCTURE ONLY
############################################################

# <ossec_config>
